  - numpy=1.24.4
  - scipy=1.10.1
  - matplotlib=3.7.5
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - pyyaml=6.0.2
  - tqdm=4.66.5
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.2.2+cu121
      - bayesian-optimization==1.4.3
      - dill==0.4.0
      - gymnasium==0.29.1
      - stable-baselines3==2.4.1
      - tensorboard==2.14.0
