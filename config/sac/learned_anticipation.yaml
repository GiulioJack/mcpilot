experiment:
  name: sac_paper
  backend: ros
  output_dir: results/sac
  seeds:
  - 100
  - 101
  - 102
  - 103
  - 104
  budgets:
  - 5
  - 15
  - 25
  - 35
  - 45
  - 55
  - 65
  - 75
  eval_repeats: 1
  evaluation_seed: 20260825
  verbose: 1
  progress_bar: false
  overwrite: false
  n_eval_targets_intermediate: 40
  n_eval_targets_final: 40
environment:
  backend: ros
  service_train: /tossing_experiment_testing
  service_eval: /tossing_experiment_testing
  service_timeout: 600.0
  service_retries: 1
  bullet_model_name: red_ball_friction
  orientation:
  - 0.0
  - 0.0
  - 0.0
  target_domain:
    l_min: 0.75
    l_max: 2.4
    gamma_max: 0.5235987755982988
    z: 0.1
  action:
    mode: absolute
    learn_anticipation: true
    anticipation_min_seconds: 0.1
    anticipation_max_seconds: 0.15
    v_min: 0.8
    v_max: 3.5
    residual_scale: 0.75
  reward:
    type: distance
    length_scale: 0.1
    success_bonus: 0.0
  hit_radius: 0.05
  observation_mode: radial_distance
  normalize_observation: true
  release_radius: 0.07
  release_z_world: 2.55
  delay:
    enabled: true
    distribution: uniform
    min_steps: 120
    max_steps: 130
    fixed_steps: 125
    mean_steps: 125.0
    std_steps: 2.5
    synthetic_ground_truth:
      enabled: true
      distribution: uniform
      min_ms: 120.0
      max_ms: 130.0
      compensate_command_anticipation: true
sac:
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 5
  batch_size: 64
  tau: 0.005
  gamma: 0.0
  train_freq: 1
  gradient_steps: 20
  ent_coef: auto_0.1
  target_update_interval: 1
  net_arch:
  - 128
  - 128
  device: cuda
